<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="theme-color" content="#0b2545">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if page.thumbnail %}{{ page.thumbnail | relative_url }}{% else %}{{ '/assets/img/home/banner.jpg' | relative_url }}{% endif %}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}#projects"{% if page.layout == 'project' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
        <a href="{{ site.pdf | relative_url }}">Portfolio PDF</a>
        <a href="{{ site.linkedin }}">LinkedIn</a>
      </nav>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>{{ site.title }}</strong><br>
      {{ site.degree }}<br>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>{% if site.phone and site.phone != "" %}<br>{{ site.phone }}{% endif %}</p>
    </div>
  </footer>
</body>
</html>
