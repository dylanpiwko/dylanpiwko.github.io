---
layout: default
---
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-text">
      <h1>{{ site.title }}</h1>
      <p class="headline">{{ site.headline }}</p>
      <p class="hero-sub">{{ site.degree }}<br>{{ site.graduation }}</p>
      <ul class="hero-links">
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        <li><a href="{{ site.linkedin }}">LinkedIn</a></li>
        <li><a href="{{ site.pdf | relative_url }}">Portfolio PDF</a></li>
      </ul>
    </div>
    <figure class="hero-photo">
      <img src="{{ '/assets/img/home/banner.jpg' | relative_url }}" alt="My Terrier-Sandhawk two-stage rocket lifting off from pad B1.">
      <figcaption>My Terrier-Sandhawk two-stage rocket at liftoff</figcaption>
    </figure>
  </div>
</section>

<div class="wrap page-body">
{{ content }}
</div>
